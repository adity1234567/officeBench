<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 716" role="img" color="#1b2330"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
     aria-label="How failures are characterized: for each failed run the evidence is the task, the initial and final files and the step-by-step trace; one question decides whether the output is correct as the task is written, routing the case either to the benchmark side or to a decisive agent step; each run receives exactly one primary code from six families plus contributing tags; the codebook was double-coded on sixteen cases with Cohen's kappa 0.78 and then applied to all 557 failed runs.">
  <defs>
    <marker id="f2arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="f2acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- evidence -->
  <rect x="30" y="60" width="220" height="170" rx="6" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="46" y="86" fill="currentColor" font-size="12" font-weight="700">Evidence, one failed run</text>
  <text x="46" y="110" fill="currentColor" font-size="11" fill-opacity=".85">the task text, as written</text>
  <text x="46" y="130" fill="currentColor" font-size="11" fill-opacity=".85">the initial files</text>
  <text x="46" y="150" fill="currentColor" font-size="11" fill-opacity=".85">every step of the trace:</text>
  <text x="56" y="167" fill="currentColor" font-size="11" fill-opacity=".7">thought &#8594; action &#8594; observation</text>
  <text x="46" y="190" fill="currentColor" font-size="11" fill-opacity=".85">the final files</text>
  <text x="46" y="210" fill="currentColor" font-size="11" fill-opacity=".85">the result of each check</text>

  <path d="M252 145 H 288 V 95 H 324" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#f2arrow)"/>

  <!-- the question -->
  <rect x="330" y="60" width="280" height="70" rx="6" fill="none" stroke="#d97706" stroke-width="1.6"/>
  <text x="470" y="88" fill="currentColor" font-size="13" font-weight="700" text-anchor="middle">Is the final output correct</text>
  <text x="470" y="108" fill="currentColor" font-size="13" font-weight="700" text-anchor="middle">for the task as written?</text>
  <text x="470" y="124" fill="currentColor" font-size="10" fill-opacity=".7" text-anchor="middle">meaning, not surface form</text>

  <path d="M470 132 V 160 H 320 V 192" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#f2arrow)"/>
  <path d="M470 132 V 160 H 700 V 192" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#f2arrow)"/>
  <text x="330" y="180" fill="currentColor" font-size="11" font-weight="700">yes &#8212; but it was scored FAIL</text>
  <text x="710" y="180" fill="currentColor" font-size="11" font-weight="700">no</text>

  <!-- benchmark side -->
  <rect x="180" y="196" width="280" height="80" rx="6" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="320" y="220" fill="currentColor" font-size="12" font-weight="700" text-anchor="middle">Benchmark side</text>
  <text x="320" y="240" fill="currentColor" font-size="11" fill-opacity=".85" text-anchor="middle">the check, the reference file</text>
  <text x="320" y="256" fill="currentColor" font-size="11" fill-opacity=".85" text-anchor="middle">or the app itself is wrong</text>

  <!-- agent side -->
  <rect x="560" y="196" width="280" height="80" rx="6" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="700" y="220" fill="currentColor" font-size="12" font-weight="700" text-anchor="middle">Find the decisive step</text>
  <text x="700" y="240" fill="currentColor" font-size="11" fill-opacity=".85" text-anchor="middle">the earliest step that, corrected</text>
  <text x="700" y="256" fill="currentColor" font-size="11" fill-opacity=".85" text-anchor="middle">alone, would most likely have passed</text>

  <line x1="700" y1="278" x2="700" y2="306" stroke="currentColor" stroke-width="1.4" marker-end="url(#f2arrow)"/>

  <rect x="560" y="310" width="280" height="66" rx="6" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="700" y="336" fill="currentColor" font-size="12" font-weight="700" text-anchor="middle">Agent side</text>
  <text x="700" y="356" fill="currentColor" font-size="11" fill-opacity=".85" text-anchor="middle">that one step carries the code</text>

  <!-- tie-break rule -->
  <rect x="870" y="196" width="190" height="180" rx="6" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="886" y="222" fill="#d97706" font-size="12" font-weight="700">Tie-break</text>
  <text x="886" y="246" fill="currentColor" font-size="11" fill-opacity=".9">A benchmark defect is</text>
  <text x="886" y="263" fill="currentColor" font-size="11" fill-opacity=".9">primary only when the</text>
  <text x="886" y="280" fill="currentColor" font-size="11" fill-opacity=".9">agent&#8217;s own work would</text>
  <text x="886" y="297" fill="currentColor" font-size="11" fill-opacity=".9">otherwise have passed.</text>
  <text x="886" y="322" fill="currentColor" font-size="11" fill-opacity=".9">Otherwise it is kept as a</text>
  <text x="886" y="339" fill="currentColor" font-size="11" fill-opacity=".9">contributing tag, and the</text>
  <text x="886" y="356" fill="currentColor" font-size="11" fill-opacity=".9">agent step stays primary.</text>

  <line x1="320" y1="278" x2="320" y2="416" stroke="currentColor" stroke-width="1.4" marker-end="url(#f2arrow)"/>
  <line x1="700" y1="378" x2="700" y2="416" stroke="currentColor" stroke-width="1.4" marker-end="url(#f2arrow)"/>

  <!-- the label -->
  <rect x="180" y="420" width="660" height="62" rx="6" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="510" y="446" fill="currentColor" font-size="13" font-weight="700" text-anchor="middle">Exactly one primary code per failed run, plus any number of contributing tags</text>
  <text x="510" y="468" fill="currentColor" font-size="11" fill-opacity=".8" text-anchor="middle">C-AMBIG (task admits two readings) &#183; C-WEAKCHECK (a wrong answer would pass) &#183; C-HARNESS &#183; C-LLMAPP</text>

  <line x1="510" y1="484" x2="510" y2="506" stroke="#d97706" stroke-width="1.6" marker-end="url(#f2acc)"/>
  <text x="522" y="500" fill="#d97706" font-size="11" font-weight="700">the primary code is one of six families</text>

  <!-- taxonomy -->
  <rect x="30" y="512" width="160" height="88" rx="6" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="44" y="534" fill="#d97706" font-size="12" font-weight="700">Benchmark defect</text>
  <text x="44" y="551" fill="currentColor" font-size="11" font-weight="700" font-family="ui-monospace, Consolas, monospace">BM</text>
  <text x="44" y="569" fill="currentColor" font-size="10" fill-opacity=".8">check asks what the task</text>
  <text x="44" y="582" fill="currentColor" font-size="10" fill-opacity=".8">does not; wrong reference</text>
  <text x="44" y="595" fill="currentColor" font-size="10" fill-opacity=".8">file; app corrupts output</text>

  <rect x="204" y="512" width="160" height="88" rx="6" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="218" y="534" fill="currentColor" font-size="12" font-weight="700">Wrong content</text>
  <text x="218" y="551" fill="currentColor" font-size="11" font-weight="700" font-family="ui-monospace, Consolas, monospace">WC &#183; TR</text>
  <text x="218" y="569" fill="currentColor" font-size="10" fill-opacity=".8">value wrong, OCR misread</text>
  <text x="218" y="582" fill="currentColor" font-size="10" fill-opacity=".8">copied, label dropped; or a</text>
  <text x="218" y="595" fill="currentColor" font-size="10" fill-opacity=".8">different operation done</text>

  <rect x="378" y="512" width="160" height="88" rx="6" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="392" y="534" fill="currentColor" font-size="12" font-weight="700">Out of budget</text>
  <text x="392" y="551" fill="currentColor" font-size="11" font-weight="700" font-family="ui-monospace, Consolas, monospace">SB &#183; TL &#183; DL</text>
  <text x="392" y="569" fill="currentColor" font-size="10" fill-opacity=".8">20 steps used up; output</text>
  <text x="392" y="582" fill="currentColor" font-size="10" fill-opacity=".8">cut at the reply cap and</text>
  <text x="392" y="595" fill="currentColor" font-size="10" fill-opacity=".8">retried; reasoning loops</text>

  <rect x="552" y="512" width="160" height="88" rx="6" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="566" y="534" fill="currentColor" font-size="12" font-weight="700">No action / gave up</text>
  <text x="566" y="551" fill="currentColor" font-size="11" font-weight="700" font-family="ui-monospace, Consolas, monospace">FMT &#183; ER &#183; PF &#183; CAP</text>
  <text x="566" y="569" fill="currentColor" font-size="10" fill-opacity=".8">invented tools; empty reply</text>
  <text x="566" y="582" fill="currentColor" font-size="10" fill-opacity=".8">read as &#8220;nothing exists&#8221;;</text>
  <text x="566" y="595" fill="currentColor" font-size="10" fill-opacity=".8">finished early; refused</text>

  <rect x="726" y="512" width="160" height="88" rx="6" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="740" y="534" fill="currentColor" font-size="12" font-weight="700">Answer language</text>
  <text x="740" y="551" fill="currentColor" font-size="11" font-weight="700" font-family="ui-monospace, Consolas, monospace">AL &#183; NC &#183; WD &#183; TX</text>
  <text x="740" y="569" fill="currentColor" font-size="10" fill-opacity=".8">right answer in Bangla</text>
  <text x="740" y="582" fill="currentColor" font-size="10" fill-opacity=".8">script; name case; word</text>
  <text x="740" y="595" fill="currentColor" font-size="10" fill-opacity=".8">choice; translation shift</text>

  <rect x="900" y="512" width="160" height="88" rx="6" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="914" y="534" fill="currentColor" font-size="12" font-weight="700">Other</text>
  <text x="914" y="551" fill="currentColor" font-size="11" font-weight="700" font-family="ui-monospace, Consolas, monospace">OTH &#183; INF</text>
  <text x="914" y="569" fill="currentColor" font-size="10" fill-opacity=".8">crashed runs and empty</text>
  <text x="914" y="582" fill="currentColor" font-size="10" fill-opacity=".8">API replies, counted as</text>
  <text x="914" y="595" fill="currentColor" font-size="10" fill-opacity=".8">failures</text>

  <text x="726" y="614" fill="currentColor" font-size="10" fill-opacity=".7">Bangla cells only &#8593;</text>

  <!-- reliability and scale -->
  <rect x="30" y="628" width="500" height="76" rx="6" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="46" y="652" fill="currentColor" font-size="12" font-weight="700">Is the coding reliable?</text>
  <text x="46" y="672" fill="currentColor" font-size="11" fill-opacity=".85">16 cases coded independently by two annotators, then reconciled</text>
  <text x="46" y="692" fill="currentColor" font-size="11" fill-opacity=".85">against the codebook &#8212; Cohen&#8217;s &#954; = 0.78 primary code, 0.64 side</text>

  <rect x="560" y="628" width="500" height="76" rx="6" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="576" y="652" fill="#d97706" font-size="12" font-weight="700">Then applied to all 557 failed runs</text>
  <text x="576" y="672" fill="currentColor" font-size="11" fill-opacity=".85">one code per failed subtask per cell, so cells can be compared: 119 subtasks</text>
  <text x="576" y="692" fill="currentColor" font-size="11" fill-opacity=".85">fail in all three full runs, 44 for the identical cause, 55 pass in all three</text>
</svg>
