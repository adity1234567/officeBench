<title>OfficeBench বাংলা ট্রেস</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: task ledger (left) + a full Bangla trace reader (right): system prompt, task, tool schema, then step-by-step thinking/command/result */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --sunk: #eef1f5; --ink: #18202c; --muted: #5a6476; --line: #dce1e8;
  --accent: #2d5a9b; --accent-soft: #e3ebf6;
  --pass: #2b7d47; --pass-soft: #e1f1e6; --fail: #b8392f; --fail-soft: #f8e4e1;
  --body: "Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151b; --surface: #181e26; --sunk: #141a21; --ink: #e5e9ef; --muted: #98a2b2; --line: #2a323d;
  --accent: #86aee8; --accent-soft: #1f2c3f;
  --pass: #63c283; --pass-soft: #1a2e22; --fail: #ee7d73; --fail-soft: #3a1f1c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #181e26; --sunk: #141a21; --ink: #e5e9ef; --muted: #98a2b2; --line: #2a323d;
  --accent: #86aee8; --accent-soft: #1f2c3f;
  --pass: #63c283; --pass-soft: #1a2e22; --fail: #ee7d73; --fail-soft: #3a1f1c; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 60px; display: grid; gap: 20px; }
h1 { font-size: clamp(22px, 3.5vw, 30px); font-weight: 700; margin: 0; }
h2 { font-size: 15px; font-weight: 700; margin: 0; }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); }
.sub { color: var(--muted); font-size: 13px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.head { display: grid; gap: 6px; }
.stat { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; }
.stat b { font-weight: 600; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.work { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 920px) { .work { grid-template-columns: minmax(0, 1fr); } }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.search { flex: 1 1 180px; min-width: 0; padding: 8px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 11px; cursor: pointer; font-size: 13px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ledger { max-height: 72vh; overflow: auto; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--sunk); }
.item[aria-selected="true"] { background: var(--accent-soft); }
.item .cid { font: 500 12px var(--mono); white-space: nowrap; }
.item .g { font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; }
.dot.pass { background: var(--pass); } .dot.fail { background: var(--fail); } .dot.pending { background: var(--muted); opacity: .4; }
.pill.pending { background: var(--sunk); color: var(--muted); }
.cmp { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 12px 14px; margin-top: 8px; overflow-x: auto; }
.cmp table { border-collapse: collapse; width: 100%; min-width: 440px; font-size: 13px; }
.cmp th, .cmp td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.cmp th { font: 500 11px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.cmp tr:last-child td { border-bottom: 0; font-weight: 600; }
.cmp .en { color: var(--muted); } .cmp .bn { color: var(--accent); font-weight: 600; }
.cmp .down { color: var(--fail); } .cmp .up { color: var(--pass); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 5px; font: 600 11px/1.5 var(--mono); }
.pill.pass { background: var(--pass-soft); color: var(--pass); }
.pill.fail { background: var(--fail-soft); color: var(--fail); }

.reader { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 18px 20px; min-height: 60vh; }
.reader .sec { margin-top: 18px; }
.reader .sec:first-of-type { margin-top: 10px; }
.block { background: var(--sunk); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.schema { font: 12px/1.6 var(--mono); max-height: 260px; overflow: auto; white-space: pre-wrap; }
.step { border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; overflow: hidden; }
.step-h { background: var(--sunk); padding: 6px 12px; font: 600 12px var(--mono); }
.part { padding: 9px 12px; border-top: 1px solid var(--line); }
.part:first-child { border-top: 0; }
.lbl { font: 600 11px/1 var(--mono); letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
.part pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 var(--mono); }
.part.cmd pre { color: var(--accent); }
.part .gloss { font-size: 13px; margin-top: 4px; }
.placeholder { color: var(--muted); text-align: center; padding: 48px 12px; }
</style>

<div class="wrap">
  <header class="head">
    <div class="eyebrow">OfficeBench · gemma4:31b · বাংলা experiment</div>
    <h1>OfficeBench — বাংলা run</h1>
    <p class="sub" id="meta"></p>
    <div class="stat" id="stat"></div>
    <div id="cmp" class="cmp"></div>
  </header>

  <div class="work">
    <div style="min-width:0">
      <div class="filters">
        <input id="q" class="search" type="search" placeholder="টাস্ক আইডি বা লক্ষ্য খুঁজুন" aria-label="খুঁজুন">
        <div class="seg" id="f-status" role="group" aria-label="ফলাফল">
          <button data-v="all" aria-pressed="true">সব</button><button data-v="pass" aria-pressed="false">সফল</button><button data-v="fail" aria-pressed="false">ব্যর্থ</button>
        </div>
        <div class="seg" id="f-apps" role="group" aria-label="অ্যাপ সংখ্যা">
          <button data-v="all" aria-pressed="true">সব</button><button data-v="1" aria-pressed="false">১</button><button data-v="2" aria-pressed="false">২</button><button data-v="3" aria-pressed="false">৩</button>
        </div>
      </div>
      <div class="ledger" id="ledger"></div>
    </div>
    <div class="reader" id="reader"><div class="placeholder">বাংলায় সম্পূর্ণ ট্রেস দেখতে বাঁ দিক থেকে একটি টাস্ক নির্বাচন করুন।<br>প্রতিটি টাস্কে থাকবে: সিস্টেম প্রম্পট, টাস্ক, টুলস স্কিমা, এবং ধাপে ধাপে চিন্তা → কমান্ড → ফলাফল।</div></div>
  </div>
</div>

<script>
const DATA = /*DATA*/null;
const BN = {0:'০',1:'১',2:'২',3:'৩',4:'৪',5:'৫',6:'৬',7:'৭',8:'৮',9:'৯'};
const bn = s => String(s).replace(/[0-9]/g, d => BN[d]);
const rows = DATA.rows;

function el(t, a = {}, ...k) {
  const n = document.createElement(t);
  for (const [key, v] of Object.entries(a)) {
    if (v == null) continue;
    if (key === 'class') n.className = v; else if (key === 'text') n.textContent = v; else n.setAttribute(key, v);
  }
  for (const c of k.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}

const done = rows.filter(r => r.status !== 'pending');
document.querySelector('#meta').textContent = 'স্ন্যাপশট ' + DATA.generated + ' · অবস্থা: ' + (DATA.state || '') + ' · ' + bn(done.length) + '/' + bn(rows.length) + ' টাস্ক চালানো';
{
  const p = done.filter(r => r.status === 'pass').length, f = done.length - p, pend = rows.length - done.length;
  document.querySelector('#stat').append(
    el('span', {}, el('i', { class: 'key', style: 'background:var(--pass)' }), el('b', { text: bn(p) }), ' সফল'),
    el('span', {}, el('i', { class: 'key', style: 'background:var(--fail)' }), el('b', { text: bn(f) }), ' ব্যর্থ'),
    pend ? el('span', {}, el('i', { class: 'key', style: 'background:var(--sunk);border:1px solid var(--line)' }), el('b', { text: bn(pend) }), ' বাকি') : null,
    el('span', { class: 'sub' }, 'এজেন্ট বাংলা prompt নিয়ে চলেছে; কমান্ডের JSON ও টুল-স্কিমা ইংরেজিতে (API identifier), পাশে বাংলা ব্যাখ্যা।'));
}
// English vs Bangla comparison (only over tasks both runs have done)
{
  const C = DATA.compare, box = document.querySelector('#cmp');
  const tbl = el('table');
  tbl.append(el('thead', {}, el('tr', {},
    el('th', { text: 'ক্যাটেগরি' }), el('th', { text: 'ইংরেজি (pass%)' }),
    el('th', { text: 'বাংলা (pass%)' }), el('th', { text: 'পার্থক্য' }))));
  const tb = el('tbody');
  const label = { 1: '১ অ্যাপ', 2: '২ অ্যাপ', 3: '৩ অ্যাপ' };
  let eP = 0, eN = 0, bP = 0, bN = 0;
  const rowFor = (title, e, b) => {
    const en = e[0] + e[1], bnn = b[0] + b[1];
    const ep = en ? 100 * e[0] / en : 0, bp = bnn ? 100 * b[0] / bnn : 0;
    const d = bp - ep;
    return el('tr', {},
      el('td', { text: title }),
      el('td', { class: 'en', text: en ? bn(ep.toFixed(0)) + '%  (' + bn(e[0]) + '/' + bn(en) + ')' : '—' }),
      el('td', { class: 'bn', text: bnn ? bn(bp.toFixed(0)) + '%  (' + bn(b[0]) + '/' + bn(bnn) + ')' : '—' }),
      el('td', { class: d < 0 ? 'down' : d > 0 ? 'up' : '', text: bnn ? (d > 0 ? '+' : '') + bn(d.toFixed(0)) + '%' : '—' }));
  };
  for (const k of [1, 2, 3]) { tb.append(rowFor(label[k], C.en[k], C.bn[k])); eP += C.en[k][0]; eN += C.en[k][1]; bP += C.bn[k][0]; bN += C.bn[k][1]; }
  tb.append(rowFor('সব মিলিয়ে', [eP, eN], [bP, bN]));
  tbl.append(tb);
  box.append(el('div', { class: 'eyebrow', style: 'margin-bottom:8px', text: 'ইংরেজি বনাম বাংলা — একই চালানো টাস্কের উপর' }), tbl);
}

const state = { q: '', status: 'all', apps: 'all', sel: null };
const ledger = document.querySelector('#ledger');
function match(r) {
  if (state.status !== 'all' && r.status !== state.status) return false;
  if (state.apps !== 'all' && String(r.apps) !== state.apps) return false;
  if (state.q && !(r.id + ' ' + (r.goal_bn || '')).toLowerCase().includes(state.q.toLowerCase())) return false;
  return true;
}
function renderLedger() {
  ledger.replaceChildren();
  const list = rows.filter(match);
  if (!list.length) { ledger.append(el('div', { class: 'placeholder', text: 'কোনো টাস্ক মেলেনি।' })); return; }
  for (const r of list) {
    const label = r.status === 'pass' ? 'সফল' : r.status === 'fail' ? 'ব্যর্থ' : 'বাকি';
    let flip = '';
    if (r.en && r.status !== 'pending' && r.en !== r.status) flip = r.en === 'pass' ? '  ⚠ ইংরেজিতে সফল ছিল' : '  ↑ ইংরেজিতে ব্যর্থ ছিল';
    ledger.append(el('div', { class: 'item', 'data-id': r.id, role: 'button', tabindex: 0, 'aria-selected': String(state.sel === r.id) },
      el('span', { class: 'dot ' + r.status }),
      el('div', { style: 'min-width:0' },
        el('div', { class: 'cid', text: r.id + '  ·  ' + bn(r.apps) + ' অ্যাপ' + flip }),
        el('div', { class: 'g', text: r.goal_bn || '' })),
      el('span', { class: 'pill ' + r.status, text: label })));
  }
}
ledger.addEventListener('click', e => { const it = e.target.closest('.item'); if (it) select(it.dataset.id); });
ledger.addEventListener('keydown', e => { const it = e.target.closest('.item'); if (it && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(it.dataset.id); } });

function bindSeg(id, key) {
  const g = document.querySelector(id);
  g.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v;
    g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === state[key])));
    renderLedger();
  });
}
bindSeg('#f-status', 'status'); bindSeg('#f-apps', 'apps');
document.querySelector('#q').addEventListener('input', e => { state.q = e.target.value.trim(); renderLedger(); });

function select(id) {
  state.sel = id;
  ledger.querySelectorAll('.item').forEach(it => it.setAttribute('aria-selected', String(it.dataset.id === id)));
  const r = rows.find(x => x.id === id);
  const R = document.querySelector('#reader');
  R.replaceChildren();
  R.append(el('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' },
    el('h2', { class: 'mono', text: r.id }),
    el('span', { class: 'pill ' + r.status, text: r.status === 'pass' ? 'বাংলা: সফল' : r.status === 'fail' ? 'বাংলা: ব্যর্থ' : 'বাকি' }),
    r.en ? el('span', { class: 'sub', text: 'ইংরেজি: ' + (r.en === 'pass' ? 'সফল' : 'ব্যর্থ') }) : null,
    el('span', { class: 'sub', text: '· ' + bn(r.apps) + ' অ্যাপ' })));

  const sec = (title, node) => { R.append(el('div', { class: 'sec' }, el('div', { class: 'eyebrow', text: title }), node)); };
  if (r.sys != null) sec('১. সিস্টেম প্রম্পট', el('div', { class: 'block', text: DATA.systems[r.sys] }));
  sec('২. ব্যবহারকারীর টাস্ক', el('div', { class: 'block', text: r.goal_bn || '' }));
  if (r.sch != null) sec('৫. টুলস স্কিমা (ইংরেজি + বাংলা ব্যাখ্যা)', el('div', { class: 'block schema', text: DATA.schemas[r.sch] }));

  if (!r.steps || !r.steps.length) {
    sec('৩+৪. ধাপসমূহ', el('div', { class: 'placeholder', text: 'এই টাস্কের কোনো সংরক্ষিত ধাপ নেই (সেভ হয়নি)।' }));
  } else {
    const wrap = el('div');
    r.steps.forEach((s, i) => {
      const parts = [];
      if (s.t) parts.push(el('div', { class: 'part' }, el('div', { class: 'lbl', text: 'চিন্তা / THINKING' }), el('pre', { text: s.t })));
      if (s.c) { const p = el('div', { class: 'part cmd' }, el('div', { class: 'lbl', text: 'কমান্ড / OUTPUT' }), el('pre', { text: s.c })); if (s.g) p.append(el('div', { class: 'gloss', text: '↳ বাংলা: ' + s.g })); parts.push(p); }
      if (s.r) parts.push(el('div', { class: 'part' }, el('div', { class: 'lbl', text: 'ফলাফল / RESULT' }), el('pre', { text: s.r })));
      wrap.append(el('div', { class: 'step' }, el('div', { class: 'step-h', text: 'ধাপ ' + bn(i) }), parts));
    });
    sec('৩+৪. ধাপে ধাপে: চিন্তা → কমান্ড → ফলাফল', wrap);
  }
  R.scrollTop = 0;
}

renderLedger();
const first = rows.find(r => r.steps && r.steps.length);
if (first && window.matchMedia('(min-width: 921px)').matches) select(first.id);
</script>
